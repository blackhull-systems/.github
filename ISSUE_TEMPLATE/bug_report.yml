name: Bug report
description: Something in this repository does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: The complete output or stack trace. Remove any private key or secret first.
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package version, Node or Python version, and OS.
      placeholder: "@blackhull/agentkit 0.1.0, Node 22.23, macOS 15"
    validations:
      required: true
